[project]
name = "sfacg_tools"
version = "1.0.0"
description = "SF轻小说多内容下载器 - 小说/漫画/有声/评论"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "flet>=0.25.0",
    "loguru>=0.7.3",
    "openai>=1.0.0",
    "Pillow>=10.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "reportlab>=5.0.0",
    "requests>=2.34.2",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
ocr = [
    "rapidocr_onnxruntime>=1.3.0",
    "numpy>=1.24.0",
]
web = [
    "playwright>=1.40.0",
]

[project.scripts]
sfacg = "main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator
    "RUF001", # ambiguous unicode chars (intentional Chinese punctuation)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "RUF012", # mutable class attribute (not harmful in tests/data classes)
    "SIM105", # contextlib.suppress vs try-except-pass
]

[tool.ruff.lint.per-file-ignores]
"sfacglib/__init__.py" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["sfacglib"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
